<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 210" width="100%" height="100%">
  <defs>
    <!-- Brand colors -->
    <style>
      .lime-green { fill: #74A626; }
      .lime-stroke { stroke: #74A626; }
      .citrus-yellow { stroke: #C4D626; }
      .editorial-gray { fill: #3A3D40; }
      .leaf-spine { stroke: #FFFFFF; stroke-width: 1.5; stroke-linecap: round; }
    </style>
  </defs>

  <!-- LIME SYMBOL (Citrus Slice / Open Book Pages) -->
  <g id="lime-symbol" transform="translate(10, 0)">
    
    <!-- Outer Rind Arc -->
    <!-- Arc from top-right (~70 deg) around clockwise to bottom-right (~355 deg) -->
    <path d="M 135 44 
             A 76 76 0 1 0 196 142 
             A 88 88 0 1 1 135 32 
             Z" 
          fill="#74A626" />
    
    <!-- Bottom right curled rind tip -->
    <path d="M 196 142 C 202 152, 196 168, 184 175 C 174 182, 160 185, 146 186 C 104 189, 58 168, 41 129 C 24 90, 42 45, 80 26 C 103 14, 131 16, 151 29 L 145 40 C 128 29, 104 27, 86 37 C 54 53, 38 90, 52 122 C 67 155, 105 172, 140 169 C 158 168, 175 160, 183 148 Z" fill="#74A626" />

    <!-- Center White Hub -->
    <circle cx="118" cy="112" r="14" fill="#FFFFFF" stroke="#74A626" stroke-width="2.5" />

    <!-- SEGMENT 1 (Top / North-North-West: ~280° to ~325°) -->
    <g id="segment-1">
      <path d="M 115 97 L 111 48 A 66 66 0 0 1 144 56 L 126 100 Z" fill="none" stroke="#74A626" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Book Page lines (yellow) -->
      <line x1="117" y1="94" x2="117" y2="50" class="citrus-yellow" stroke-width="1.6" />
      <line x1="119" y1="94" x2="124" y2="51" class="citrus-yellow" stroke-width="1.6" />
      <line x1="121" y1="95" x2="131" y2="53" class="citrus-yellow" stroke-width="1.6" />
      <line x1="123" y1="96" x2="138" y2="56" class="citrus-yellow" stroke-width="1.6" />
    </g>

    <!-- SEGMENT 2 (Top-Left / North-West: ~230° to ~275°) -->
    <g id="segment-2">
      <path d="M 104 102 L 67 70 A 66 66 0 0 1 103 48 L 112 96 Z" fill="none" stroke="#74A626" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Book Page lines (yellow) -->
      <line x1="106" y1="99" x2="74" y2="67" class="citrus-yellow" stroke-width="1.6" />
      <line x1="107" y1="97" x2="82" y2="60" class="citrus-yellow" stroke-width="1.6" />
      <line x1="108" y1="96" x2="90" y2="55" class="citrus-yellow" stroke-width="1.6" />
      <line x1="110" y1="95" x2="98" y2="51" class="citrus-yellow" stroke-width="1.6" />
    </g>

    <!-- SEGMENT 3 (Mid-Left / West: ~180° to ~225°) -->
    <g id="segment-3">
      <path d="M 102 113 L 52 109 A 66 66 0 0 1 64 74 L 103 105 Z" fill="none" stroke="#74A626" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Book Page lines (yellow) -->
      <line x1="101" y1="111" x2="55" y2="102" class="citrus-yellow" stroke-width="1.6" />
      <line x1="102" y1="109" x2="57" y2="94" class="citrus-yellow" stroke-width="1.6" />
      <line x1="102" y1="107" x2="60" y2="86" class="citrus-yellow" stroke-width="1.6" />
      <line x1="103" y1="106" x2="65" y2="79" class="citrus-yellow" stroke-width="1.6" />
    </g>

    <!-- SEGMENT 4 (Lower-Left / South-West: ~135° to ~180°) -->
    <g id="segment-4">
      <path d="M 104 122 L 64 149 A 66 66 0 0 1 53 115 L 102 115 Z" fill="none" stroke="#74A626" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Book Page lines (yellow) -->
      <line x1="102" y1="118" x2="55" y2="122" class="citrus-yellow" stroke-width="1.6" />
      <line x1="103" y1="120" x2="58" y2="130" class="citrus-yellow" stroke-width="1.6" />
      <line x1="103" y1="121" x2="63" y2="138" class="citrus-yellow" stroke-width="1.6" />
      <line x1="104" y1="122" x2="69" y2="145" class="citrus-yellow" stroke-width="1.6" />
    </g>

    <!-- SEGMENT 5 (Bottom-Left / South-South-West: ~90° to ~135°) -->
    <g id="segment-5">
      <path d="M 113 127 L 105 175 A 66 66 0 0 1 69 153 L 106 123 Z" fill="none" stroke="#74A626" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Book Page lines (yellow) -->
      <line x1="107" y1="124" x2="76" y2="157" class="citrus-yellow" stroke-width="1.6" />
      <line x1="109" y1="125" x2="84" y2="164" class="citrus-yellow" stroke-width="1.6" />
      <line x1="110" y1="126" x2="92" y2="169" class="citrus-yellow" stroke-width="1.6" />
      <line x1="112" y1="126" x2="100" y2="173" class="citrus-yellow" stroke-width="1.6" />
    </g>

    <!-- SEGMENT 6 (Bottom-Right / South-South-East: ~45° to ~90°) -->
    <g id="segment-6">
      <path d="M 124 126 L 157 161 A 66 66 0 0 1 113 176 L 116 127 Z" fill="none" stroke="#74A626" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Book Page lines (yellow) -->
      <line x1="118" y1="126" x2="119" y2="174" class="citrus-yellow" stroke-width="1.6" />
      <line x1="120" y1="126" x2="128" y2="172" class="citrus-yellow" stroke-width="1.6" />
      <line x1="122" y1="126" x2="138" y2="168" class="citrus-yellow" stroke-width="1.6" />
      <line x1="123" y1="125" x2="148" y2="162" class="citrus-yellow" stroke-width="1.6" />
    </g>

    <!-- SEGMENT 7 (Right-Bottom: ~0° to ~45°) -->
    <g id="segment-7">
      <path d="M 128 119 L 180 125 A 66 66 0 0 1 162 158 L 126 124 Z" fill="none" stroke="#74A626" stroke-width="2.5" stroke-linejoin="round" />
      <!-- Book Page lines (yellow) -->
      <line x1="127" y1="122" x2="176" y2="132" class="citrus-yellow" stroke-width="1.6" />
      <line x1="127" y1="123" x2="171" y2="141" class="citrus-yellow" stroke-width="1.6" />
      <line x1="126" y1="124" x2="165" y2="149" class="citrus-yellow" stroke-width="1.6" />
      <line x1="125" y1="124" x2="157" y2="155" class="citrus-yellow" stroke-width="1.6" />
    </g>
  </g>

  <!-- LEAVES ON TOP OF 'I' -->
  <g id="sprout-leaves" transform="translate(236, 12)">
    <!-- Left Leaf -->
    <path d="M 16 32 C 12 22, 0 14, -8 16 C -12 24, -2 34, 16 32 Z" fill="#74A626" />
    <path d="M 14 31 C 6 25, 0 21, -6 18" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Right Leaf -->
    <path d="M 16 32 C 20 20, 32 12, 40 14 C 44 22, 34 32, 16 32 Z" fill="#74A626" />
    <path d="M 18 31 C 26 24, 32 20, 38 16" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- TYPOGRAPHY: LIMA -->
  <g id="word-lima" class="lime-green" transform="translate(180, 42)">
    <!-- 'L' -->
    <path d="M 0 5 C 0 2.2, 2.2 0, 5 0 L 14 0 C 16.8 0, 19 2.2, 19 5 L 19 86 C 19 88.8, 21.2 91, 24 91 L 62 91 C 65 91, 67 93, 67 96 L 67 101 C 67 104, 65 106, 62 106 L 10 106 C 4.5 106, 0 101.5, 0 96 Z" />
    
    <!-- 'I' -->
    <path d="M 68 5 C 68 2.2, 70.2 0, 73 0 L 82 0 C 84.8 0, 87 2.2, 87 5 L 87 101 C 87 103.8, 84.8 106, 82 106 L 73 106 C 70.2 106, 68 103.8, 68 101 Z" />
    
    <!-- 'M' -->
    <path d="M 104 5 C 104 2.2, 106.2 0, 109 0 L 118 0 C 120.5 0, 122.5 1.8, 123 4.2 L 144 72 L 165 4.2 C 165.5 1.8, 167.5 0, 170 0 L 179 0 C 181.8 0, 184 2.2, 184 5 L 184 101 C 184 103.8, 181.8 106, 179 106 L 171 106 C 168.2 106, 166 103.8, 166 101 L 166 28 L 149 84 C 148 87, 145 89, 142 89 C 139 89, 136 87, 135 84 L 118 28 L 118 101 C 118 103.8, 115.8 106, 113 106 L 105 106 C 102.2 106, 100 103.8, 100 101 L 100 5 C 100 2.2, 101.8 0, 104 0 Z" />
    
    <!-- 'A' -->
    <path d="M 226 0 C 230 0, 233.5 2.5, 235 6 L 261 98 C 262 101.5, 259.5 105, 256 105 L 246 105 C 243 105, 240.5 103, 239.5 100 L 233 76 L 208 76 L 201.5 100 C 200.5 103, 198 105, 195 105 L 185 105 C 181.5 105, 179 101.5, 180 98 L 217 6 C 218.5 2.5, 222 0, 226 0 Z M 221 28 L 212 62 L 229 62 Z" />
  </g>

  <!-- TYPOGRAPHY: EDITORIAL -->
  <g id="word-editorial" class="editorial-gray" transform="translate(250, 162)">
    <!-- E -->
    <path d="M 0 0 L 16 0 C 18 0, 19 1, 19 3 L 19 5 C 19 7, 18 8, 16 8 L 5 8 L 5 12 L 14 12 C 15.5 12, 16.5 13, 16.5 14.5 L 16.5 15.5 C 16.5 17, 15.5 18, 14 18 L 5 18 L 5 23 L 16 23 C 18 23, 19 24, 19 26 L 19 28 C 19 30, 18 31, 16 31 L 3 31 C 1 31, 0 30, 0 28 Z" />
    
    <!-- D -->
    <path d="M 25 0 L 35 0 C 42 0, 47 4.5, 47 15.5 C 47 26.5, 42 31, 35 31 L 25 31 Z M 30 7 L 30 24 L 35 24 C 38.5 24, 41.5 21, 41.5 15.5 C 41.5 10, 38.5 7, 35 7 Z" />
    
    <!-- I -->
    <path d="M 54 0 L 59 0 L 59 31 L 54 31 Z" />
    
    <!-- T -->
    <path d="M 64 0 L 80 0 L 80 7 L 75 7 L 75 31 L 69 31 L 69 7 L 64 7 Z" />
    
    <!-- O -->
    <path d="M 94 0 C 101.5 0, 106.5 5, 106.5 15.5 C 106.5 26, 101.5 31, 94 31 C 86.5 31, 81.5 26, 81.5 15.5 C 81.5 5, 86.5 0, 94 0 Z M 94 7 C 89.5 7, 87 10.5, 87 15.5 C 87 20.5, 89.5 24, 94 24 C 98.5 24, 101 20.5, 101 15.5 C 101 10.5, 98.5 7, 94 7 Z" />
    
    <!-- R -->
    <path d="M 113 0 L 123 0 C 128 0, 131 2.5, 131 8 C 131 12, 128.5 14.5, 125 15.5 L 132 29 C 132.8 30.5, 131.5 31, 129.5 31 L 124 31 L 118.5 18 L 118 18 L 118 31 L 113 31 Z M 118 6.5 L 118 13 L 122.5 13 C 124.5 13, 126 11.5, 126 9.5 C 126 7.5, 124.5 6.5, 122.5 6.5 Z" />
    
    <!-- I -->
    <path d="M 137 0 L 142 0 L 142 31 L 137 31 Z" />
    
    <!-- A -->
    <path d="M 152 0 L 158 0 L 166 31 L 160.5 31 L 159 24 L 151 24 L 149.5 31 L 144 31 Z M 155 8 L 152.2 19 L 157.8 19 Z" />
    
    <!-- L -->
    <path d="M 172 0 L 177 0 L 177 24 C 177 25, 178 26, 179 26 L 187 26 C 188.5 26, 189.5 27, 189.5 28.5 C 189.5 30, 188.5 31, 187 31 L 176 31 C 173.5 31, 172 29, 172 26.5 Z" />
  </g>
</svg>
