    <!-- Left Leaf -->
    <path d="M 0 36 C -5 23, -17 14, -28 17 C -32 26, -20 38, 0 36 Z" fill="#74A626" />
    <path d="M -2 35 C -11 28, -18 23, -26 19" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
    
